role: Aggregator

image:
  tag: "0.54.0-alpine"

podLabels:
  app: vector-aggregator

service:
  enabled: false

customConfig:
  data_dir: /vector-data-dir

  sources:
    vector_source:
      type: vector
      address: "0.0.0.0:6000"

  transforms:
    parse_external:
      type: remap
      inputs: ["vector_source"]
      source: |
        # format_timestamp! drops events with malformed timestamps — acceptable for PoC
        .timestamp = format_timestamp!(.timestamp, format: "%Y-%m-%d %H:%M:%S%.9f")
        .env = "external"
        # to_string handles missing/null .host gracefully (unlike string() which errors)
        .host = to_string(.host) ?? "unknown"

        parsed, err = parse_json(.message)
        if err == null {
          .service = string(parsed.service) ?? "unknown"
          .level = upcase(string(parsed.level) ?? "INFO")
          .fields = {}
          for_each(object(parsed) ?? {}) -> |key, value| {
            if key != "level" && key != "message" && key != "service" {
              .fields = set!(.fields, [key], to_string!(value))
            }
          }
          .message = string(parsed.message) ?? .message
        } else {
          .service = "unknown"
          .level = "INFO"
          .fields = {}
        }

  sinks:
    clickhouse:
      type: clickhouse
      inputs: ["parse_external"]
      endpoint: "http://logs-clickhouse-0-0-0.logs-clickhouse-headless.logging.svc.cluster.local:8123"
      database: default
      table: logs
      encoding:
        only_fields:
          - timestamp
          - service
          - env
          - host
          - level
          - message
          - fields
      batch:
        max_bytes: 10485760
        timeout_secs: 2
      buffer:
        type: disk
        max_size: 524288000
        when_full: block

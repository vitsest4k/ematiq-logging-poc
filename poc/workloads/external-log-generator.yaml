apiVersion: v1
kind: ConfigMap
metadata:
  name: external-vector-config
  namespace: external
data:
  vector.yaml: |
    data_dir: /tmp/vector-data

    sources:
      risk_logs:
        type: file
        include:
          - /var/log/risk-server/risk.log
        read_from: beginning

    sinks:
      aggregator:
        type: vector
        inputs: ["risk_logs"]
        address: "aggregator-svc.logging.svc.cluster.local:6000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-log-generator
  namespace: external
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-log-generator
  template:
    metadata:
      labels:
        app: external-log-generator
    spec:
      volumes:
        - name: log-vol
          emptyDir: {}
        - name: vector-config
          configMap:
            name: external-vector-config
      containers:
        - name: log-generator
          image: alpine:3.19
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /var/log/risk-server
              PORTFOLIOS="TECH FINANCE ENERGY HEALTH CONSUMER"
              i=0
              while true; do
                i=$((i+1))
                IDX=$(( (i % 5) + 1 ))
                PORTFOLIO=$(echo "$PORTFOLIOS" | tr ' ' '\n' | sed -n "${IDX}p")
                EXPOSURE=$(( (RANDOM % 500000) + 1000000 ))
                LIMIT=1000000
                ACTION=$([ $EXPOSURE -gt $LIMIT ] && echo "halt" || echo "allow")
                LEVEL=$([ "$ACTION" = "halt" ] && echo "WARN" || echo "INFO")
                printf '{"level":"%s","message":"risk limit breached","service":"risk-server","portfolio":"%s","exposure_usd":%d,"limit_usd":%d,"action":"%s"}\n' \
                  "$LEVEL" "$PORTFOLIO" "$EXPOSURE" "$LIMIT" "$ACTION" \
                  >> /var/log/risk-server/risk.log
                sleep 1
              done
          volumeMounts:
            - name: log-vol
              mountPath: /var/log/risk-server
        - name: vector-agent
          image: timberio/vector:0.54.0-alpine
          command: ["/bin/sh", "-c", "mkdir -p /tmp/vector-data && vector --config /etc/vector/vector.yaml"]
          volumeMounts:
            - name: log-vol
              mountPath: /var/log/risk-server
            - name: vector-config
              mountPath: /etc/vector

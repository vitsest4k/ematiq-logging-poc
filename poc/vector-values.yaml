role: Agent

service:
  enabled: false

customConfig:
  data_dir: /vector-data-dir

  sources:
    kubernetes_logs:
      type: kubernetes_logs

  transforms:
    parse_logs:
      type: remap
      inputs: ["kubernetes_logs"]
      source: |
        # Format timestamp for ClickHouse DateTime64(9)
        .timestamp = format_timestamp!(.timestamp, format: "%Y-%m-%d %H:%M:%S%.9f")

        .env = "local"
        .host = string(.kubernetes.node_name) ?? "unknown"

        # Try to parse JSON message
        parsed, err = parse_json(.message)
        if err == null {
          # Prefer application's self-reported service name over pod label
          .service = string(parsed.service) ?? string(.kubernetes.labels.app) ?? string(.kubernetes.pod_name) ?? "unknown"
          .level = upcase(string(parsed.level) ?? "INFO")
          .fields = {}
          for_each(object(parsed) ?? {}) -> |key, value| {
            if key != "level" && key != "message" && key != "service" {
              .fields = set!(.fields, [key], to_string!(value))
            }
          }
          .message = string(parsed.message) ?? .message
        } else {
          .service = string(.kubernetes.labels.app) ?? string(.kubernetes.pod_name) ?? "unknown"
          .level = "INFO"
          .fields = {}
        }

  sinks:
    clickhouse:
      type: clickhouse
      inputs: ["parse_logs"]
      endpoint: "http://logs-clickhouse-0-0-0.logs-clickhouse-headless.logging.svc.cluster.local:8123"
      database: default
      table: logs
      encoding:
        only_fields:
          - timestamp
          - service
          - env
          - host
          - level
          - message
          - fields
      batch:
        max_bytes: 10485760
        timeout_secs: 2
      buffer:
        type: disk
        max_size: 524288000
        when_full: block
